<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E3327" />
    <title>Tidak Ada Koneksi | Industry Management</title>
    <style>
      :root {
        --background: #ede9e0;
        --foreground: #1c1c1a;
        --botanical-800: #1e3327;
        --muted: #7e7972;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        color: var(--foreground);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(900px 500px at 5% 0%, rgba(120, 170, 130, 0.35) 0%, transparent 55%),
          radial-gradient(800px 600px at 95% 5%, rgba(220, 150, 110, 0.28) 0%, transparent 50%),
          radial-gradient(700px 500px at 70% 100%, rgba(150, 180, 200, 0.25) 0%, transparent 55%),
          var(--background);
        background-attachment: fixed;
      }
      .panel {
        width: 100%;
        max-width: 26rem;
        padding: 2rem;
        border-radius: 1.25rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow:
          0 1px 2px rgba(28, 28, 26, 0.04),
          0 8px 24px rgba(28, 28, 26, 0.06);
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.375rem;
        line-height: 1.3;
      }
      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: var(--muted);
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6875rem 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--botanical-800);
        color: #faf7f1;
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #16261d;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <img src="/icon-192.png" alt="" />
      <h1>Tidak ada koneksi</h1>
      <p>
        Perangkat ini sedang tidak terhubung ke internet. Data ERP tidak
        disimpan di perangkat, jadi halamannya baru bisa dibuka setelah
        koneksi kembali.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
